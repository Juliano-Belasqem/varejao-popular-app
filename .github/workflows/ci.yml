name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-test-key
      SUPABASE_SECRET_KEY: ci-placeholder-secret
      META_GRAPH_API_VERSION: v26.0
      META_FACEBOOK_PAGE_ID: ci-placeholder-page
      META_INSTAGRAM_USER_ID: ci-placeholder-instagram
      META_PAGE_ACCESS_TOKEN: ci-placeholder-token
      META_FACEBOOK_APP_ID: ci-placeholder-app
      META_FACEBOOK_APP_SECRET: ci-placeholder-secret
      CRON_SECRET: ci-placeholder-cron
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regression tests
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build

      - name: Install browser for visual editor tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Visual editor end-to-end (local fixtures)
        run: node tests/run-visual-browser.mjs

      - name: Save browser verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-editor-verification
          path: test-results/
          retention-days: 7
