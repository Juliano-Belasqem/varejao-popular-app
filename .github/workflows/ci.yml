name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      SUPABASE_SECRET_KEY: ci-placeholder-secret
      META_GRAPH_API_VERSION: v26.0
      META_FACEBOOK_PAGE_ID: ci-placeholder-page
      META_INSTAGRAM_USER_ID: ci-placeholder-instagram
      META_PAGE_ACCESS_TOKEN: ci-placeholder-token
      META_FACEBOOK_APP_ID: ci-placeholder-app
      META_FACEBOOK_APP_SECRET: ci-placeholder-secret
      CRON_SECRET: ci-placeholder-cron
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
